# Global dynamics workflow inputs.
#
# Robot-specific files in dynamics/config/<robot>.yaml may override these
# values. CLI arguments and Python API keyword arguments override both.

robot_name: xarm6
embodiment_id: xarm6_g2_metadata_only
sdk_backend: xarm
urdf_path: assets/urdf/xarm6/xarm6/xarm6.urdf
joint_count: 6
home_joints_deg: [14.1, -8.0, -24.7, 196.9, 62.3, -8.8]
gripper_open: 840.0

connection:
  ip: 192.168.1.199
  robot_port: 502
  report_port_normal: 30001
  report_port_rich: 30002
  report_port_real: 30003
  sdk_timeout_s: 0.5

payload:
  enabled: true
  profile: xarm_gripper_g2
  mode: metadata_only

paths:
  trajectory_dir: dynamics/calibration/traj
  torque_dir: dynamics/calibration/torque
  compensation_model: dynamics/calibration/compensation/compensation.pt

sampling_hz: 100

trajectory:
  kind: all
  duration_s:
  teach_sensitivity:
  workspace_points: 20
  workspace_margin_ratio: 0.05
  workspace_speed_deg_s: 30.0
  workspace_seed: 7

torque:
  traj_path:
  model_path:
  replay_speed_deg_s: 30.0
  replay_acc_deg_s2: 200.0

training:
  data_path:
  static_data_path:
  stop_data_path:
  model_kind: baseline
  target: residual
  epochs: 200
  lr: 0.001
  hidden_dim: 64
  seed: 7

compensation:
  hybrid:
    static_alpha: 1.0
    speed_threshold_deg_s: 2.0
    motion_history_steps: 3
    min_level_gap_nm: 1.0
    default_decay_tau_s: 0.35
    blend_alpha: 0.2
    settle_lambda_threshold: 0.05
    detect_ema_alpha: 0.05
    j3_jump_size_nm: 5.28

monitor:
  model_path:
